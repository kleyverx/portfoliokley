name: Generar la culebrita de contribuciones

# Repinta el grafico de contribuciones como un juego de snake y publica los SVG
# en la rama `output`. El README apunta a esa rama, no a este workflow.
on:
  schedule:
    # Cada 12 horas. El grafico cambia poco, no hace falta mas.
    - cron: "0 */12 * * *"
  workflow_dispatch:      # permite lanzarlo a mano desde la pestana Actions
  push:
    branches:
      - main

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # necesario para publicar en la rama `output`
    steps:
      - name: Generar los SVG (claro, oscuro y gif)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-oscuro.svg?palette=github-dark&color_snake=#7c3aed&color_dots=#161b22,#4808AA,#7c3aed,#a78bfa,#c4b5fd
            dist/snake-claro.svg?palette=github-light&color_snake=#4808AA&color_dots=#ede9fe,#c4b5fd,#a78bfa,#7c3aed,#4808AA
            dist/snake.gif?color_snake=#7c3aed&color_dots=#161b22,#4808AA,#7c3aed,#a78bfa,#c4b5fd

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
